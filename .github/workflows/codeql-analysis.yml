name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: '0 9 * * 3'

jobs:
  analyze:
    # Code scanning is available without GitHub Advanced Security once the
    # repository is public. Keep private staging runs green without discarding
    # the workflow that will protect the published repository.
    if: github.event.repository.visibility == 'public'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['go', 'javascript-typescript']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
      with:
        languages: ${{ matrix.language }}
        config: |
          paths-ignore:
            - web/dist/**
            - third_party/**

    - name: Autobuild
      if: ${{ matrix.language == 'go' }}
      uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
