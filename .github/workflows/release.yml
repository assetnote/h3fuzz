name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Verify third-party license bundle
        run: |
          node scripts/generate-third-party-licenses.mjs
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt
          test -z "$(git status --porcelain --untracked-files=all -- THIRD_PARTY_LICENSES.txt)"
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
      - name: Verify embedded web assets are current
        run: |
          git diff --exit-code -- web/dist
          test -z "$(git status --porcelain --untracked-files=all -- web/dist)"
      - name: Verify patched quic-go provenance
        run: scripts/verify-third-party-quic-go.sh
      - name: Test patched quic-go HTTP/3 package
        working-directory: third_party/quic-go
        run: |
          go vet ./http3
          go test -race ./http3 -count=1
      - name: Check root module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
